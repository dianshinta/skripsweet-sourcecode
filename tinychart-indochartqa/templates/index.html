<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tanyagrafikbps</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container-fluid py-4">

    <!-- Header -->
    <div class="text-center mb-3">
        <h3 class="fw-bold">TanyaGrafik</h3>
        <p class="text-muted">
            Menggunakan model fine-tuned TinyChart-3B untuk tanya jawab grafik berbahasa Indonesia
        </p>
    </div>

    <div class="row g-4">

        <!-- LEFT -->
        <div class="col-lg-4">

            <div class="card shadow-sm">

                <div class="card-header">
                    <h6 class="mb-0">Preview Grafik</h6>
                </div>

                <div class="card-body text-center">

                    <img
                        id="previewImage"
                        src=""
                        class="img-fluid rounded d-none"
                    >

                    <div id="emptyPreview">

                        <div style="font-size:80px">
                            📊
                        </div>

                        <p class="text-muted">
                            Unggah gambar grafik
                        </p>

                    </div>

                    <div class="mt-3">

                        <input
                            type="file"
                            id="imageInput"
                            class="form-control"
                            accept="image/jpg,image/png,image/jpeg"
                        >
                    </div>

                </div>

            </div>

        </div>

        <!-- RIGHT -->
        <div class="col-lg-8">

            <div class="card shadow-sm">

                <div class="card-header">
                    <h6 class="mb-0">Percakapan</h6>
                </div>

                <div
                    class="card-body"
                    id="chatBox">
                </div>

            </div>

        </div>

    </div>

    <!-- Question -->
    <div class="card shadow-sm mt-2 mb-0">

        <div class="card-body">

            <div class="row">

                <div class="col-md-11">

                    <input
                        type="text"
                        id="questionInput"
                        class="form-control form-control-lg"
                        placeholder="Tanya apapun mengenai grafik..."
                    >

                </div>

                <div class="col-md-1 d-grid">

                    <button
                        class="btn btn-primary btn-lg"
                        id="askButton">
                        Tanya
                    </button>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="/static/script.js"></script>

</body>
</html>
